[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-webui-conversation-improvement"
version = "0.1.0"
description = "Native Open WebUI filter and tools for restrained visual expression and scoped media memory"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["open_webui_conversation_improvement"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
